name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r aruco_svg_generator/requirements.txt
          pip install pyinstaller

      - name: Self test
        run: python aruco_svg_generator/main.py --selftest

      - name: Build EXE
        run: python aruco_svg_generator/build_exe.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: szArUco-windows-exe
          path: aruco_svg_generator/dist/*.exe
          if-no-files-found: error

      - name: Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: aruco_svg_generator/dist/*.exe
          generate_release_notes: true
