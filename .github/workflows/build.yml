name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

# 发布 Release 需要写权限（新仓库默认 GITHUB_TOKEN 为只读）
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r aruco_svg_generator/requirements.txt
          pip install pyinstaller

      - name: Self test
        run: python aruco_svg_generator/main.py --selftest

      - name: Show self-test log (on failure)
        if: failure()
        run: Get-Content "$env:TEMP\aruco_selftest.log" -Encoding UTF8

      - name: Build EXE
        run: python aruco_svg_generator/build_exe.py

      - name: Self test the built EXE
        run: |
          # exe 为 windowed 子系统，PowerShell 的 & 不会等待进程，须用 Start-Process -Wait 取退出码
          $exe = Get-ChildItem aruco_svg_generator/dist/*.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:TEMP\aruco_selftest.log" -Encoding UTF8
          if ($p.ExitCode -ne 0) { throw "Frozen EXE self-test failed (exit $($p.ExitCode))" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: szArUco-windows-exe
          path: aruco_svg_generator/dist/*.exe
          if-no-files-found: error

      - name: Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: aruco_svg_generator/dist/*.exe
          generate_release_notes: true
